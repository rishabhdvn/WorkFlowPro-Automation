name: Automated Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: |
        playwright install chromium

    - name: Run Tests
      # We skip the integration test in CI because it requires a real backend
      # This demonstrates to the recruiter you understand CI limitations
      run: |
        pytest tests/test_login_fix.py --html=reports/report.html

    - name: Upload Test Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-report
        path: reports/