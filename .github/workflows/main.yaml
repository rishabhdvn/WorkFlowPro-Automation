name: Automated Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4  # Updated to v4

    - name: Set up Python
      uses: actions/setup-python@v5 # Updated to v5
      with:
        python-version: '3.12' 

    - name: Install Dependencies
      continue-on-error: true
      run: |
        python -m pip install --upgrade pip
        pip install pytest playwright pytest-playwright pytest-html requests
        
    - name: Install Browsers
      continue-on-error: true
      run: |
        playwright install chromium --with-deps

    - name: Run Tests
      continue-on-error: true
      run: |
        pytest tests/ --html=reports/report.html || true

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4 # FIXED: Updated to v4 to fix the error
      with:
        name: test-report
        path: reports/